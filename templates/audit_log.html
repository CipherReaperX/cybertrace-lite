<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Log | CyberTrace-Lite</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar navbar-dark ct-navbar">
  <div class="container-fluid px-4">
    <span class="navbar-brand mb-0 h1 d-flex align-items-center gap-2">
      <a href="{{ url_for('dashboard') }}" class="text-decoration-none text-reset d-flex align-items-center gap-2">
        <span class="ct-logo">🛡</span> CYBERTRACE-LITE
      </a>
      <small class="ct-subtitle">Audit Log</small>
    </span>
    <a href="{{ url_for('dashboard') }}" class="btn btn-sm btn-outline-light">← Back to dashboard</a>
  </div>
</nav>

<div class="container-fluid px-4 py-4">
  <div class="ct-card p-3">
    <div class="ct-card-title">Recent administrative activity (last 200)</div>
    <div class="table-responsive">
      <table class="table ct-table table-sm align-middle mb-0">
        <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Detail</th></tr></thead>
        <tbody>
          {% for r in rows %}
          <tr>
            <td class="text-muted">{{ r.created_at }}</td>
            <td>{{ r.username or '-' }}</td>
            <td>{{ r.action }}</td>
            <td class="text-muted">{{ r.detail }}</td>
          </tr>
          {% else %}
          <tr><td colspan="4" class="text-muted">No audit entries yet.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
