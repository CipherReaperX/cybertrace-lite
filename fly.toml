# Fly.io deploy config for CyberTrace-Lite.
# Deploy with (after `flyctl auth login` and `flyctl launch --no-deploy` once
# to create the app + adjust `app` below to the name Fly assigns you):
#
#   flyctl volumes create ct_database --size 1 --region <your-region>
#   flyctl deploy
#
app = "cybertrace-lite"
primary_region = "iad"

[build]

[env]
  PORT = "5000"

[[mounts]]
  source = "ct_database"
  destination = "/app/database"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
